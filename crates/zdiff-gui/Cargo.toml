[package]
name = "zdiff-gui"
version = "2.1.0"
edition = "2024"

[lib]
path = "src/gui/lib.rs"
doctest = false

[[bin]]
name = "zdiff-gui"
path = "src/gui/main.rs"

[features]
default = ["pretty-backtrace"]
pretty-backtrace = ["dep:color-backtrace"]
debug_alloc = ["dep:stats_alloc"]

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33.3", features = ["wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
# The implement macro expands to ::windows_core paths.
windows-core = "0.62.2"

[dependencies]
zcommon = { path = "../zcommon", features = ["serde"] }
zcommon-ui = { path = "../zcommon-ui" }
zdiff = { path = "../zdiff", features = ["serde"] }
zdiff-folder = { path = "../zdiff-folder", features = ["serde"] }
eframe = { workspace = true }
egui_tiles =  {version = "0.14.1", features = ["serde"]}
egui_extras = { workspace = true, features = ["image"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
# bat's syntax set (TypeScript, TOML, ...); its regex feature must match syntect's (fancy, not onig).
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
# Direct, for the image viewer's decoders: egui_extras pulls image without them.
image = { workspace = true, features = ["png", "jpeg", "bmp", "gif", "webp", "tga"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
memmap2 = "0.9.10"
pdb = "0.8.0"
rayon = { workspace = true }
rfd = "0.17.1"
color-backtrace = { version = "0.7.2", optional = true }
stats_alloc = { version = "0.1", optional = true }
tempfile = { workspace = true }

[dev-dependencies]
zcommon = { path = "../zcommon", features = ["test-util"] }

[build-dependencies]
# Resamples img/icon.png into the exe icon sizes (build.rs).
image = { workspace = true, features = ["png"] }
