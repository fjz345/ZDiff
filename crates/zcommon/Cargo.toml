[package]
name = "zcommon"
version = "2.0.1"
edition = "2024"

[lib]
name = "zcommon"

[features]
default = []
serde = ["dep:serde"]
test-util = []

[dependencies]
blake3 = { version = "1.8.2", features = ["rayon", "mmap"] }
log = { workspace = true }
regex = { workspace = true }
env_logger = "0.11.9"
dotenvy = "0.15.7"
tempfile = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }