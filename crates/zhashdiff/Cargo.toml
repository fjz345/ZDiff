[package]
name = "zhashdiff"
version = "2.0.1"
edition = "2024"

[features]
default = []
pretty-backtrace = []
serde = ["zcommon/serde", "dep:serde", "dep:serde_json"]

[dependencies]
zcommon = { path = "../zcommon" }
zdiff = { path = "../zdiff" }
rayon = "1.12.0"
serde = { version = "1.0.48", features = ["derive"], optional = true}
serde_json = { version = "1.0.48", optional = true }
log = "0.4.27"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tga"] }
# Apartment-threaded COM init: the GUI thread is already an OLE STA (winit drag and
# drop), where a multithreaded init fails and trash panics.
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
md-5 = "0.11.0"

[dev-dependencies]
zcommon = { path = "../zcommon", features = ["test-util"] }
tempfile = "3.25.0"
