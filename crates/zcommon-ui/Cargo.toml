[package]
name = "zcommon-ui"
version = "2.0.1"
edition = "2024"

[lib]
name = "zcommon_ui"

[dependencies]
zcommon = { path = "../zcommon", features = ["serde"] }
eframe = { version = "0.33.3", default-features = false, features = [
    "default_fonts",
    "accesskit",
    "glow",
    "serde",
    "persistence"
] }
egui_extras = { version = "0.33.3", features = ["image"] }
winit = { version = "0.30.13", default-features = false }
log = "0.4.27"
tempfile = "3.27.0"
serde_json = "1.0.48"
serde = { version = "1.0.48", features = ["derive"] }

[dev-dependencies]
zcommon = { path = "../zcommon", features = ["test-util"] }
