[package]
name = "zcommon-ui"
version = "2.0.1"
edition = "2024"

[lib]
name = "zcommon_ui"

[dependencies]
zcommon = { path = "../zcommon", features = ["serde"] }
eframe = { workspace = true }
egui_extras = { workspace = true, features = ["image"] }
winit = { version = "0.30.13", default-features = false }
log = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
zcommon = { path = "../zcommon", features = ["test-util"] }
