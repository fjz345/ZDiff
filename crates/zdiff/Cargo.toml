[package]
name = "zdiff"
version = "2.0.0"
edition = "2024"

[lib]
name = "zdiff"

[[bench]]
name = "pipeline"
harness = false

[features]
default = []
pretty-backtrace = []
serde = ["zcommon/serde", "dep:serde"]

[dependencies]
zcommon = { path = "../zcommon" }
serde = { version = "1.0.48", features = ["derive"], optional = true}
log = "0.4.27"
rayon = "1.12.0"
regex = "1.12.3"

[dev-dependencies]
tempfile = "3.27.0"
