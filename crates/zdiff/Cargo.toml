[package]
name = "zdiff"
version = "2.1.0"
edition = "2024"

[lib]
name = "zdiff"

[[bench]]
name = "pipeline"
harness = false

[features]
default = []
pretty-backtrace = []
serde = ["zcommon/serde", "dep:serde"]

[dependencies]
zcommon = { path = "../zcommon" }
serde = { workspace = true, optional = true }
log = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
