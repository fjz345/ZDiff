[package]
name = "zdiff-folder"
version = "2.1.0"
edition = "2024"

[features]
default = []
pretty-backtrace = []
serde = ["zcommon/serde", "dep:serde", "dep:serde_json"]

[dependencies]
zcommon = { path = "../zcommon" }
zdiff = { path = "../zdiff" }
rayon = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
log = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "bmp", "gif", "webp", "tga"] }
# Apartment-threaded COM init: the GUI thread is already an OLE STA (winit drag and
# drop), where a multithreaded init fails and trash panics.
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
md-5 = "0.11.0"

[dev-dependencies]
zcommon = { path = "../zcommon", features = ["test-util"] }
tempfile = { workspace = true }
