[package]
name = "zdiff-folder-gui"
version = "2.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "zdiff-folder-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[features]
default = ["gui", "serde"]
serde = ["zdiff-folder/serde", "zcommon/serde", "dep:serde", "dep:serde_json"]
gui = ["serde", "dep:zcommon-ui", "dep:eframe", "dep:egui_tiles", "dep:egui_extras"]
pretty-backtrace = ["dep:color-backtrace"]
accesskit = []

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33.3", features = ["wayland", "x11"], optional = true }

[dependencies]
zcommon = { path = "../zcommon" }
zcommon-ui = { path = "../zcommon-ui", optional = true }
zdiff-folder = { path = "../zdiff-folder" }
eframe = { version = "0.33.3", default-features = false, features = [
    "default_fonts",
    "accesskit",
    "glow",
    "serde",
    "persistence"
], optional = true }
egui_tiles =  { version = "0.14.1", features = ["serde"], optional = true }
egui_extras = { version = "0.33.3", features = ["image"], optional = true  }
serde = { version = "1.0.48", features = ["derive"], optional = true}
serde_json = { version = "1.0.48", optional = true }
log = "0.4.27"
memmap2 = "0.9.10"
rfd = "0.17.1"
color-backtrace = { version = "0.7.2", optional = true }

[dev-dependencies]
tempfile = "3.25.0"

[build-dependencies]
image = { version = "0.25.9", default-features = false, features = ["png"] }