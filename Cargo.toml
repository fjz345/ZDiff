[workspace]
members = [ "crates/zcommon",
    "crates/zcommon-ui",
    "crates/zdiff",
    "crates/zdiff-gui",
    "crates/zdiff-folder",
    "xtask",
]
resolver = "2"

[workspace.dependencies]
eframe = { version = "0.33.3", default-features = false, features = [
    "default_fonts",
    "glow",
    "serde",
    "persistence"
] }
egui_extras = "0.33.3"
image = { version = "0.25.9", default-features = false }
log = "0.4.29"
rayon = "1.12.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
# Link Time Optimization: Aggressively optimizes across crate boundaries
lto = true 
# Reduces parallel build tasks to 1, allowing better global optimization
codegen-units = 1 
# Automatically strip symbols from the binary (replaces the 'strip' command)
strip = true 
# Removes stack unwinding code (saves space, but panics will just abort)
panic = "abort"

# Add this to your workspace Cargo.toml
[profile.dev]
opt-level = 0
debug = true
strip = false
panic = "unwind" # Keep unwinding for better error logs

# Dependencies only: unoptimized egui alone takes most of a 60 Hz frame, which the frame-time
# tests need. The workspace crates stay unoptimized.
[profile.dev.package."*"]
opt-level = 2
